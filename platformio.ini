; PlatformIO Project Configuration File for ESP32-S3 N16R8 + UDA1334A DAC
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3_n16r8_arduino
src_dir = firmware_platformio/src

[env:esp32s3_n16r8_arduino]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Board configuration for 16MB Quad Flash & 8MB Octal PSRAM (N16R8)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; Build flags: Octal PSRAM + UDA1334A Hardware I2S Pin definitions
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCORE_DEBUG_LEVEL=3
    -DI2S_BCLK=4
    -DI2S_WCLK=5
    -DI2S_DOUT=6

; Clean dependencies compatible with ESP32-S3 (no legacy ESP8266Audio DAC/ULP)
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    AsyncTCP-esphome @ ^2.0.1

monitor_speed = 115200
upload_speed = 921600
