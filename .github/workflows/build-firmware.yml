name: Build ESP32-S3 Firmware and Web UI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-esp32-firmware:
    name: Build ESP32-S3 N16R8 Firmware & Merged Bin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio>=6.1.15 esptool>=4.7.0

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build ESP32-S3 Firmware via PlatformIO
        run: |
          echo "=========================================================="
          echo " Compiling ESP32-S3 N16R8 Firmware via PlatformIO"
          echo "=========================================================="
          pio run -e esp32s3_n16r8_arduino

      - name: Generate Unified Flash Image (merged.bin)
        run: |
          echo "=========================================================="
          echo " Merging Bootloader, Partition Table, and App Firmware"
          echo "=========================================================="
          python firmware/merge_bin.py

      - name: List Generated Binaries
        run: |
          echo "=== Build Artifacts Directory ==="
          ls -la build_artifacts/ || true
          echo "=== PlatformIO Output Directory ==="
          ls -la .pio/build/esp32s3_n16r8_arduino/ || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-bundle
          path: |
            build_artifacts/*.bin
            build_artifacts/*.txt
            .pio/build/esp32s3_n16r8_arduino/*.bin
            .pio/build/esp32s3_n16r8_arduino/*.elf
          retention-days: 30

  build-web-app:
    name: Lint and Build Web Controller Interface
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run TypeScript Linter
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-bundle
          path: dist/
          retention-days: 14
